# ============================================================================
# GRAPH METADATA SEARCH + NEO4J — BETA-КОНТУР
# Адаптация вендорского Graph_metadata_search/docker-compose.yml (dist 2026-08-30)
# под beta-контур alcor. Изменения против вендорского файла: только значения
# по умолчанию (beta-имена/порты/пути) — структура и env-контракт вендорские.
# ============================================================================
name: ${COMPOSE_PROJECT_NAME:-graph_metadata_beta}

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j@sha256:7d8d70f78c0c55830a162e6ae212799649b0cfd349dbfe413aab8124f7cabf1b}
    container_name: ${NEO4J_CONTAINER_NAME:-neo4j_beta}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7574}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7787}:7687"
    volumes:
      - "${NEO4J_DATA_PATH:?задай в .env}:/data"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?задай в .env}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-2g}
      NEO4J_db_query_default__language: ${NEO4J_DEFAULT_CYPHER:-CYPHER_25}
    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEMORY_LIMIT:-5G}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  mcp-app:
    image: comol/1c_graph_metadata:${IMAGE_TAG:-light-beta}
    container_name: ${MCP_CONTAINER_NAME:-1c_graph_metadata_beta}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8106}:8006"
    volumes:
      # НА ЗАПИСЬ: CALCULATE_BUSINESS_INFO=true пишет business_info.html рядом
      # с объектом; read-only = молчаливая потеря описаний при трате токенов.
      - "${METADATA_FILES_HOST_PATH:?задай в .env}:/app/code"
      - "${EXTENSIONS_HOST_PATH:-${METADATA_FILES_HOST_PATH}}:/app/extensions"
      - "${GRAPH_STATE_PATH:?задай в .env}:/app/data"
      # Плагины переживают docker pull (копии example.py/AGENTS.md внутрь!)
      - "${PATH_BASES:?}/graph_plugins:/app/plugins"
    environment:
      LICENSE_KEY: ${LICENSE_KEY:?Set LICENSE_KEY in .env}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?задай в .env}
      NEO4J_HEAP_INITIAL_SIZE: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_HEAP_SIZE: ${NEO4J_HEAP_SIZE:-2g}
      NEO4J_PAGECACHE_SIZE: ${NEO4J_PAGECACHE_SIZE:-2g}
      NEO4J_MEMORY_OVERHEAD: ${NEO4J_MEMORY_OVERHEAD:-1g}
      NEO4J_MEMORY_LIMIT: ${NEO4J_MEMORY_LIMIT:-5G}
      METADATA_FILES: /app/code
      CODE_EXPORT_PATH: /app/code
      PROJECT_NAME: ${PROJECT_NAME:-LISmcp}
      # Extension catalog: расширения = упорядоченные слои одного project_id
      EXTENSION_CATALOG_ENABLED: ${EXTENSION_CATALOG_ENABLED:-true}
      EXTENSIONS_PATH: ${EXTENSIONS_PATH:-/app/extensions}
      EXTENSION_ORDER_MANIFEST: ${EXTENSION_ORDER_MANIFEST:-}
      EXTENSION_CATALOG_SYNC: ${EXTENSION_CATALOG_SYNC:-true}
      # Manifest refresh: refresh_graph_project обновляет проект на месте,
      # сохраняя business-описания и эмбеддинги (иначе refresh=full rebuild)
      SOURCE_UNIT_MANIFEST_ENABLED: ${SOURCE_UNIT_MANIFEST_ENABLED:-true}
      # Чистая Neo4j (greenfield) — scope включаем сразу
      MCP_NAMESPACE: ${MCP_NAMESPACE:-default}
      GRAPH_SCOPE_ENFORCED: ${GRAPH_SCOPE_ENFORCED:-true}
      GRAPH_SCOPE_MIGRATION_WINDOW: ${GRAPH_SCOPE_MIGRATION_WINDOW:-false}
      INGESTION_STATE_DIRECTORY: /app/data/.ingestion
      SOURCE_FORMAT_ADAPTERS_ENABLED: ${SOURCE_FORMAT_ADAPTERS_ENABLED:-true}
      SOURCE_FORMAT: ${SOURCE_FORMAT:-}
      MCP_TOOL_PROFILE: ${MCP_TOOL_PROFILE:-admin}
      GRAPH_PLUGINS_ENABLED: ${GRAPH_PLUGINS_ENABLED:-true}
      # Semantic/business search включён (GRAPH_ONLY=false): нужны EMBEDDING_*
      # и CHAT (маппится на OPENAI_* — вендорские имена внутри graph-контейнера)
      GRAPH_ONLY: ${GRAPH_ONLY:-false}
      TEMPLATE_MODE_ENABLED: ${TEMPLATE_MODE_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://routerai.ru/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen/qwen3-235b-a22b}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY:-}}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://routerai.ru/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      CALCULATE_BUSINESS_INFO: ${CALCULATE_BUSINESS_INFO:-true}
      ENABLE_BUSINESS_SEARCH: ${ENABLE_BUSINESS_SEARCH:-true}
      LOAD_BSL_SIGNATURES: ${LOAD_BSL_SIGNATURES:-true}
      ENABLE_ROUTINE_EMBEDDINGS: ${ENABLE_ROUTINE_EMBEDDINGS:-true}
      LOAD_FORMS_FROM_XML: ${LOAD_FORMS_FROM_XML:-true}
      LOAD_EVENT_SUBSCRIPTIONS: ${LOAD_EVENT_SUBSCRIPTIONS:-true}
      LOAD_PREDEFINED_VALUES: ${LOAD_PREDEFINED_VALUES:-true}
      LOAD_ROLE_RIGHTS: ${LOAD_ROLE_RIGHTS:-true}
      LOAD_HELP_FROM_HTML: ${LOAD_HELP_FROM_HTML:-true}
      MCP_USE_SSE: ${MCP_USE_SSE:-false}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8006
    deploy:
      resources:
        limits:
          memory: ${MCP_APP_MEMORY_LIMIT:-6G}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/healthz', timeout=10).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
